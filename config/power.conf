# Stock 1.0.0.73 uses the internal PMU charger and BATV ADC, not CW6305.
CONFIG_ACTS_LEOPARD_BATTERY_SUPPLY_EXTERNAL=n
CONFIG_ACTS_LEOPARD_BATTERY_SUPPLY_INTERNAL=y
CONFIG_ACTS_BATTERY_SUPPORT_CHARGER_NTC=y
CONFIG_ACTS_BATTERY_SUPPORT_MINI_CHARGER_NTC=y
CONFIG_ACTS_BATTERY_POWERON_MIN_VOL_WITHOUT_DC5V=3400
# Stock GPIO speaker amplifier. Remain silent until the explicit sound test.
CONFIG_AUDIO_PA_AW87390_SUPPORT=n
CONFIG_BOARD_EXTERNAL_PA_ENABLE=y
CONFIG_AUDIO_POWERON_OPEN_PA=n
